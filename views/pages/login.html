{{define "content"}}
<h1>Log in</h1>

{{if .Error}}<p class="error">{{.Error}}</p>{{end}}

<form method="POST" action="/login">
    <label>Email
        <input type="email" name="email" value="{{.Email}}" required>
    </label>
    <label>Password
        <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</botton>
</form>
{{end}}
